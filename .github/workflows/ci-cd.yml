name: Java CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  WAR_FILE: target/devopsproject.war
  APP_NAME: devopsproject
  TOMCAT_VERSION: 10.1.57

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Install Java on GitHub runner
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build the WAR file
      - name: Build WAR
        run: mvn clean package

      # 4. Verify the WAR exists
      - name: Verify WAR
        shell: bash
        run: |
          ls -la target

          if [ ! -f "$WAR_FILE" ]; then
            echo "WAR file not found: $WAR_FILE"
            exit 1
          fi

          echo "WAR file created: $WAR_FILE"

      # 5. Run SonarCloud scan
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      # 6. Connect GitHub Actions to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Verify AWS authentication
      - name: Test AWS connection
        run: aws sts get-caller-identity

      # 8. Check whether EC2 exists
      - name: Check EC2
        id: check_ec2
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EC2 does not exist. A new instance will be created."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            echo "Existing EC2 found: $INSTANCE_ID"
          fi

      # 9. Create EC2 only when missing
      - name: Create EC2
        id: create_ec2
        if: steps.check_ec2.outputs.exists == 'false'
        shell: bash
        run: |
          set -e

          echo "Finding default VPC..."

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=is-default,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "Default VPC not found"
            exit 1
          fi

          echo "Default VPC: $VPC_ID"

          echo "Finding default subnet..."

          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=default-for-az,Values=true" \
            --query "Subnets[0].SubnetId" \
            --output text)

          if [ "$SUBNET_ID" = "None" ] || [ -z "$SUBNET_ID" ]; then
            echo "Default subnet not found"
            exit 1
          fi

          echo "Default subnet: $SUBNET_ID"

          echo "Finding security group..."

          SG_ID=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=java-app-sg" \
              "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            echo "Creating security group..."

            SG_ID=$(aws ec2 create-security-group \
              --group-name java-app-sg \
              --description "Security group for Java Tomcat application" \
              --vpc-id "$VPC_ID" \
              --query "GroupId" \
              --output text)
          fi

          echo "Security group: $SG_ID"

          # Open SSH port
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0 || true

          # Open Tomcat port
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 8080 \
            --cidr 0.0.0.0/0 || true

          echo "Finding Amazon Linux AMI..."

          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
              "Name=architecture,Values=x86_64" \
              "Name=state,Values=available" \
            --query "sort_by(Images,&CreationDate)[-1].ImageId" \
            --output text)

          if [ "$AMI_ID" = "None" ] || [ -z "$AMI_ID" ]; then
            echo "Amazon Linux AMI not found"
            exit 1
          fi

          echo "AMI ID: $AMI_ID"

          # Install Java and Tomcat during EC2 startup
          cat > user-data.sh <<EOF
          #!/bin/bash
          set -e

          dnf update -y
          dnf install -y java-17-amazon-corretto-devel wget tar

          rm -rf /opt/tomcat
          rm -rf /opt/apache-tomcat-${TOMCAT_VERSION}
          rm -f /tmp/apache-tomcat-${TOMCAT_VERSION}.tar.gz

          wget \
            -O /tmp/apache-tomcat-${TOMCAT_VERSION}.tar.gz \
            https://archive.apache.org/dist/tomcat/tomcat-10/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz

          tar \
            -xzf /tmp/apache-tomcat-${TOMCAT_VERSION}.tar.gz \
            -C /opt

          mv \
            /opt/apache-tomcat-${TOMCAT_VERSION} \
            /opt/tomcat

          chmod +x /opt/tomcat/bin/*.sh

          /opt/tomcat/bin/startup.sh
          EOF

          echo "Creating EC2 instance..."

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type t3.micro \
            --key-name "${{ secrets.AWS_KEY_NAME }}" \
            --security-group-ids "$SG_ID" \
            --subnet-id "$SUBNET_ID" \
            --associate-public-ip-address \
            --user-data file://user-data.sh \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
            --query "Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "EC2 creation failed"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "New EC2 created: $INSTANCE_ID"

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

      # 10. Select existing or newly created EC2
      - name: Get EC2 details
        id: server
        shell: bash
        run: |
          if [ "${{ steps.check_ec2.outputs.exists }}" = "true" ]; then
            INSTANCE_ID="${{ steps.check_ec2.outputs.instance_id }}"
            echo "Using existing EC2: $INSTANCE_ID"
          else
            INSTANCE_ID="${{ steps.create_ec2.outputs.instance_id }}"
            echo "Using new EC2: $INSTANCE_ID"
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "EC2 state: $STATE"

          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped \
              --instance-ids "$INSTANCE_ID"

            STATE="stopped"
          fi

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          if [ "$STATE" = "pending" ]; then
            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
            echo "EC2 does not have a public IP"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"

      # 11. Create temporary SSH key
      - name: Prepare SSH key
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          if [ ! -s key.pem ]; then
            echo "EC2_PRIVATE_KEY is empty"
            exit 1
          fi

      # 12. Wait until EC2 SSH is available
      - name: Wait for SSH
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "SSH attempt: $attempt"

            if ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i key.pem \
              "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
              "echo SSH connected"; then

              echo "SSH is ready"
              exit 0
            fi

            echo "Waiting for SSH..."
            sleep 20
          done

          echo "SSH connection failed"
          exit 1

      # 13. Install or repair Java and Tomcat
      - name: Install Java and Tomcat
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" <<EOF

              set -e

              sudo cloud-init status --wait || true

              sudo dnf install -y \
                java-17-amazon-corretto-devel \
                wget \
                tar

              if [ ! -f /opt/tomcat/bin/startup.sh ]; then
                echo "Installing Tomcat..."

                sudo rm -rf /opt/tomcat
                sudo rm -rf /opt/apache-tomcat-${TOMCAT_VERSION}

                # Fixes the previous permission-denied issue
                sudo rm -f \
                  /tmp/apache-tomcat-${TOMCAT_VERSION}.tar.gz

                sudo wget \
                  -O /tmp/apache-tomcat-${TOMCAT_VERSION}.tar.gz \
                  https://archive.apache.org/dist/tomcat/tomcat-10/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz

                sudo tar \
                  -xzf /tmp/apache-tomcat-${TOMCAT_VERSION}.tar.gz \
                  -C /opt

                sudo mv \
                  /opt/apache-tomcat-${TOMCAT_VERSION} \
                  /opt/tomcat
              fi

              if [ ! -f /opt/tomcat/bin/startup.sh ]; then
                echo "Tomcat installation failed"
                exit 1
              fi

              sudo chmod +x /opt/tomcat/bin/*.sh

              echo "Java and Tomcat are ready"

          EOF

      # 14. Copy WAR to EC2
      - name: Copy WAR to EC2
        shell: bash
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}:/tmp/$APP_NAME.war"

      # 15. Deploy WAR into Tomcat
      - name: Deploy application
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" <<EOF

              set -e

              sudo /opt/tomcat/bin/shutdown.sh || true

              sleep 5

              sudo rm -rf \
                /opt/tomcat/webapps/${APP_NAME}

              sudo rm -f \
                /opt/tomcat/webapps/${APP_NAME}.war

              sudo cp \
                /tmp/${APP_NAME}.war \
                /opt/tomcat/webapps/${APP_NAME}.war

              sudo chmod 644 \
                /opt/tomcat/webapps/${APP_NAME}.war

              sudo /opt/tomcat/bin/startup.sh

          EOF

      # 16. Verify application
      - name: Verify application
        shell: bash
        run: |
          URL="http://${{ steps.server.outputs.public_ip }}:8080/${APP_NAME}/"

          echo "Checking application URL:"
          echo "$URL"

          for attempt in {1..20}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "Attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application deployed successfully"
              echo "Application URL: $URL"
              exit 0
            fi

            sleep 10
          done

          echo "Application verification failed"
          exit 1

      # 17. Delete temporary SSH key
      - name: Delete temporary SSH key
        if: always()
        run: rm -f key.pem
