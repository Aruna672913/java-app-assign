name: Java CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  APP_NAME: devopsproject
  WAR_FILE: target/devopsproject.war
  TOMCAT_PORT: "8080"
  VPC_ID: ${{ vars.VPC_ID }}
  SUBNET_ID: ${{ vars.SUBNET_ID }}
  SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

          test -f "$WAR_FILE"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find or create EC2
        id: ec2
        env:
          AWS_KEY_NAME: ${{ secrets.AWS_KEY_NAME }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ]; then
            AMI_ID=$(aws ssm get-parameter \
              --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
              --query "Parameter.Value" \
              --output text)

            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t3.micro \
              --key-name "$AWS_KEY_NAME" \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECURITY_GROUP_ID" \
              --associate-public-ip-address \
              --tag-specifications \
                "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
              --query "Instances[0].InstanceId" \
              --output text)
          else
            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              STATE="stopped"
            fi

            if [ "$STATE" = "stopped" ]; then
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            fi
          fi

          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$EC2_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

      - name: Wait for SSH
        run: |
          for i in {1..30}; do
            ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -i key.pem \
              "$EC2_USER@${{ steps.ec2.outputs.ip }}" \
              "echo connected" && exit 0

            sleep 10
          done

          exit 1

      - name: Copy WAR
        run: |
          scp -o StrictHostKeyChecking=no \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.ec2.outputs.ip }}:/tmp/$APP_NAME.war"

      - name: Install Tomcat and deploy
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i key.pem \
            "$EC2_USER@${{ steps.ec2.outputs.ip }}" \
            "sudo bash -s -- '$APP_NAME'" <<'REMOTE'
          set -e

          APP_NAME="$1"

          dnf install -y java-17-amazon-corretto-headless curl tar

          if [ ! -f /opt/tomcat/bin/startup.sh ]; then
            curl -fL \
              https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.120/bin/apache-tomcat-9.0.120.tar.gz \
              -o /tmp/tomcat.tar.gz

            mkdir -p /opt/tomcat
            tar -xzf /tmp/tomcat.tar.gz \
              -C /opt/tomcat \
              --strip-components=1

            chmod +x /opt/tomcat/bin/*.sh
          fi

          /opt/tomcat/bin/shutdown.sh || true
          sleep 5

          rm -rf "/opt/tomcat/webapps/$APP_NAME"
          rm -f "/opt/tomcat/webapps/$APP_NAME.war"

          cp "/tmp/$APP_NAME.war" \
            "/opt/tomcat/webapps/$APP_NAME.war"

          /opt/tomcat/bin/startup.sh
          REMOTE

      - name: Verify deployment
        run: |
          URL="http://${{ steps.ec2.outputs.ip }}:$TOMCAT_PORT/$APP_NAME/"

          curl --fail \
            --retry 15 \
            --retry-delay 10 \
            --retry-connrefused \
            "$URL"

          echo "Application URL: $URL"
          echo "Application URL: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f key.pem
