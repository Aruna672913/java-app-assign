name: Java CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_NAME: Webserver
  APP_NAME: devopsproject
  WAR_FILE: target/devopsproject.war
  TOMCAT_PORT: "8080"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: |
          mvn -B clean package
          test -f "$WAR_FILE"

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - name: Find or create EC2
        id: ec2
        env:
          VPC_ID: ${{ vars.VPC_ID || secrets.VPC_ID }}
          SUBNET_ID: ${{ vars.SUBNET_ID || secrets.SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID || secrets.SECURITY_GROUP_ID }}
          INSTANCE_PROFILE: ${{ vars.EC2_INSTANCE_PROFILE || secrets.EC2_INSTANCE_PROFILE }}
        run: |
          set -euo pipefail

          for VALUE in VPC_ID SUBNET_ID SECURITY_GROUP_ID INSTANCE_PROFILE; do
            test -n "${!VALUE}" || {
              echo "$VALUE is missing"
              exit 1
            }
          done

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Creating new EC2"

            AMI_ID=$(aws ec2 describe-images \
              --owners amazon \
              --filters \
                "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
                "Name=state,Values=available" \
              --query "sort_by(Images,&CreationDate)[-1].ImageId" \
              --output text)

            cat > user-data.sh <<'SCRIPT'
          #!/bin/bash
          dnf install -y amazon-ssm-agent || true
          systemctl enable --now amazon-ssm-agent
          SCRIPT

            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t3.micro \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECURITY_GROUP_ID" \
              --associate-public-ip-address \
              --iam-instance-profile "Name=$INSTANCE_PROFILE" \
              --user-data file://user-data.sh \
              --tag-specifications \
                "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
              --query "Instances[0].InstanceId" \
              --output text)

            echo "Created EC2: $INSTANCE_ID"

          else
            echo "Using existing EC2: $INSTANCE_ID"

            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped \
                --instance-ids "$INSTANCE_ID"

              STATE="stopped"
            fi

            if [ "$STATE" = "stopped" ]; then
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID" >/dev/null
            fi

            PROFILE=$(aws ec2 describe-iam-instance-profile-associations \
              --filters "Name=instance-id,Values=$INSTANCE_ID" \
              --query "IamInstanceProfileAssociations[0].AssociationId" \
              --output text)

            if [ "$PROFILE" = "None" ] || [ -z "$PROFILE" ]; then
              aws ec2 associate-iam-instance-profile \
                --instance-id "$INSTANCE_ID" \
                --iam-instance-profile "Name=$INSTANCE_PROFILE" >/dev/null
            fi
          fi

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Upload WAR to S3
        id: artifact
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          BUCKET="java-cicd-${ACCOUNT_ID}-${AWS_REGION}"
          KEY="${GITHUB_SHA}/${APP_NAME}.war"

          if ! aws s3api head-bucket \
            --bucket "$BUCKET" 2>/dev/null; then

            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --create-bucket-configuration \
                  "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3 cp \
            "$WAR_FILE" \
            "s3://$BUCKET/$KEY"

          WAR_URL=$(aws s3 presign \
            "s3://$BUCKET/$KEY" \
            --expires-in 3600)

          echo "war_url=$WAR_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy using Systems Manager
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          WAR_URL="${{ steps.artifact.outputs.war_url }}"

          for ATTEMPT in {1..36}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              echo "Systems Manager is online"
              break
            fi

            if [ "$ATTEMPT" = "36" ]; then
              echo "EC2 did not become available in Systems Manager"
              exit 1
            fi

            echo "Waiting for Systems Manager..."
            sleep 10
          done

          cat > commands.json <<EOF
          {
            "commands": [
              "set -e",
              "dnf install -y java-17-amazon-corretto-headless tar",
              "if [ ! -x /opt/tomcat/bin/startup.sh ]; then curl -fsSL 'https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.120/bin/apache-tomcat-9.0.120.tar.gz' -o /tmp/tomcat.tar.gz; mkdir -p /opt/tomcat; tar -xzf /tmp/tomcat.tar.gz -C /opt/tomcat --strip-components=1; chmod +x /opt/tomcat/bin/*.sh; fi",
              "curl -fsSL '$WAR_URL' -o /tmp/$APP_NAME.war",
              "/opt/tomcat/bin/shutdown.sh || true",
              "sleep 5",
              "rm -rf /opt/tomcat/webapps/$APP_NAME /opt/tomcat/webapps/$APP_NAME.war",
              "cp /tmp/$APP_NAME.war /opt/tomcat/webapps/$APP_NAME.war",
              "/opt/tomcat/bin/startup.sh",
              "sleep 10",
              "curl -fsS http://127.0.0.1:$TOMCAT_PORT/$APP_NAME/"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://commands.json \
            --comment "Deploy $APP_NAME" \
            --query "Command.CommandId" \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query \
              "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      - name: Verify application
        run: |
          URL="http://${{ steps.ec2.outputs.public_ip }}:$TOMCAT_PORT/$APP_NAME/"

          curl \
            --fail \
            --retry 18 \
            --retry-delay 10 \
            --retry-connrefused \
            "$URL"

          echo "Application URL: $URL"
          echo "Application URL: [$URL]($URL)" \
            >> "$GITHUB_STEP_SUMMARY"
