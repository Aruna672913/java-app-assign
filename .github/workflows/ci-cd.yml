name: Java CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  APP_NAME: devopsproject
  WAR_FILE: target/devopsproject.war

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR
        run: test -f "$WAR_FILE"

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find or create EC2
        id: ec2
        env:
          AMI_ID: ${{ secrets.AMI_ID }}
          AWS_KEY_NAME: ${{ secrets.AWS_KEY_NAME }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ secrets.SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=pending,running,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "EC2 not found. Creating a new EC2."

            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t3.micro \
              --key-name "$AWS_KEY_NAME" \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECURITY_GROUP_ID" \
              --associate-public-ip-address \
              --tag-specifications \
                "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
              --query "Instances[0].InstanceId" \
              --output text)
          else
            echo "Existing EC2 found: $INSTANCE_ID"

            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            if [ "$STATE" = "stopped" ]; then
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
            fi
          fi

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
            echo "EC2 public IP not found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Instance ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"

      - name: Allow GitHub runner SSH
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          SG_ID=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" \
            --output text)

          RUNNER_IP=$(wget \
            --quiet \
            --max-redirect=0 \
            --output-document=- \
            https://checkip.amazonaws.com |
            tr -d '[:space:]')

          if [ -z "$RUNNER_IP" ]; then
            echo "GitHub runner IP could not be identified"
            exit 1
          fi

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 8080 \
            --cidr 0.0.0.0/0 || true

          echo "SSH allowed for GitHub runner: $RUNNER_IP"

      - name: Prepare SSH key
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_PRIVATE_KEY" ]; then
            echo "EC2_PRIVATE_KEY is empty"
            exit 1
          fi

          printf '%s\n' "$EC2_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

      - name: Wait for SSH
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          for attempt in {1..20}; do
            echo "SSH check $attempt"

            if ssh-keyscan \
              -T 5 \
              -H "${{ steps.ec2.outputs.public_ip }}" \
              > "$HOME/.ssh/known_hosts" 2>/dev/null; then

              chmod 600 "$HOME/.ssh/known_hosts"

              if ssh \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=10 \
                -i key.pem \
                "$EC2_USER@${{ steps.ec2.outputs.public_ip }}" \
                "echo SSH connected"; then
                exit 0
              fi
            fi

            sleep 15
          done

          echo "SSH connection failed"
          exit 1

      - name: Install Java and Tomcat
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i key.pem \
            "$EC2_USER@${{ steps.ec2.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -euo pipefail

          VERSION="10.1.57"
          FILE="/tmp/tomcat.tar.gz"
          URL="https://archive.apache.org/dist/tomcat/tomcat-10/v${VERSION}/bin/apache-tomcat-${VERSION}.tar.gz"

          dnf install -y \
            java-17-amazon-corretto-devel \
            wget \
            tar

          if [ ! -f /opt/tomcat/bin/startup.sh ]; then
            rm -rf /opt/tomcat
            rm -f "$FILE"

            wget \
              --quiet \
              --max-redirect=0 \
              --output-document="$FILE" \
              "$URL"

            mkdir -p /opt/tomcat

            tar -xzf "$FILE" \
              -C /opt/tomcat \
              --strip-components=1
          fi

          test -f /opt/tomcat/bin/startup.sh
          chmod +x /opt/tomcat/bin/*.sh

          echo "Java and Tomcat are ready"

          REMOTE

      - name: Copy WAR
        run: |
          scp \
            -o StrictHostKeyChecking=yes \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.ec2.outputs.public_ip }}:/tmp/$APP_NAME.war"

      - name: Deploy application
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i key.pem \
            "$EC2_USER@${{ steps.ec2.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -euo pipefail

          APP_NAME="devopsproject"

          /opt/tomcat/bin/shutdown.sh || true
          sleep 5

          rm -rf "/opt/tomcat/webapps/$APP_NAME"
          rm -f "/opt/tomcat/webapps/$APP_NAME.war"

          cp "/tmp/$APP_NAME.war" \
            "/opt/tomcat/webapps/$APP_NAME.war"

          chmod 644 \
            "/opt/tomcat/webapps/$APP_NAME.war"

          /opt/tomcat/bin/startup.sh

          REMOTE

      - name: Verify deployment
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i key.pem \
            "$EC2_USER@${{ steps.ec2.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -euo pipefail

          APP_NAME="devopsproject"

          for attempt in {1..20}; do
            if pgrep -f "org.apache.catalina.startup.Bootstrap" >/dev/null \
              && ss -ltn | grep -q ":8080 " \
              && [ -f "/opt/tomcat/webapps/$APP_NAME.war" ]; then

              echo "Deployment verified successfully"
              exit 0
            fi

            sleep 10
          done

          tail -100 /opt/tomcat/logs/catalina.out || true
          exit 1

          REMOTE

          echo "Public IP: ${{ steps.ec2.outputs.public_ip }}"
          echo "Port: 8080"
          echo "Path: /$APP_NAME/"

      - name: Cleanup
        if: always()
        run: rm -f key.pem
