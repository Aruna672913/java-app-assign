name: Java CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  WAR_FILE: target/devopsproject.war
  APP_NAME: devopsproject

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR
        shell: bash
        run: |
          ls -la target
          test -f "$WAR_FILE" || { echo "WAR file not found: $WAR_FILE"; exit 1; }

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS connection
        run: aws sts get-caller-identity

      - name: Check EC2
        id: check_ec2
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EC2 does not exist. A new EC2 will be created."
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            echo "Existing EC2 found: $INSTANCE_ID"
          fi

      - name: Create EC2
        id: create_ec2
        if: steps.check_ec2.outputs.exists == 'false'
        shell: bash
        run: |
          set -e

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=is-default,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text)

          test -n "$VPC_ID" && [ "$VPC_ID" != "None" ] || { echo "Default VPC not found"; exit 1; }

          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=default-for-az,Values=true" \
            --query "Subnets[0].SubnetId" \
            --output text)

          test -n "$SUBNET_ID" && [ "$SUBNET_ID" != "None" ] || { echo "Default subnet not found"; exit 1; }

          SG_ID=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=java-app-sg" \
              "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name java-app-sg \
              --description "Security group for Java Tomcat application" \
              --vpc-id "$VPC_ID" \
              --query "GroupId" \
              --output text)
          fi

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0 || true

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 8080 \
            --cidr 0.0.0.0/0 || true

          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
              "Name=architecture,Values=x86_64" \
              "Name=state,Values=available" \
            --query "sort_by(Images,&CreationDate)[-1].ImageId" \
            --output text)

          test -n "$AMI_ID" && [ "$AMI_ID" != "None" ] || { echo "Amazon Linux 2023 AMI not found"; exit 1; }

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type t3.micro \
            --key-name "${{ secrets.AWS_KEY_NAME }}" \
            --security-group-ids "$SG_ID" \
            --subnet-id "$SUBNET_ID" \
            --associate-public-ip-address \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
            --query "Instances[0].InstanceId" \
            --output text)

          test -n "$INSTANCE_ID" && [ "$INSTANCE_ID" != "None" ] || { echo "EC2 creation failed"; exit 1; }

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

      - name: Get EC2 details
        id: server
        shell: bash
        run: |
          if [ "${{ steps.check_ec2.outputs.exists }}" = "true" ]; then
            INSTANCE_ID="${{ steps.check_ec2.outputs.instance_id }}"
          else
            INSTANCE_ID="${{ steps.create_ec2.outputs.instance_id }}"
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE="stopped"
          fi

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
          fi

          if [ "$STATE" = "pending" ]; then
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          test -n "$PUBLIC_IP" && [ "$PUBLIC_IP" != "None" ] || { echo "EC2 has no public IP"; exit 1; }

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "Public IP: $PUBLIC_IP"

      - name: Prepare SSH key
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Wait for SSH
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i key.pem \
              "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
              "echo SSH connected"; then
              exit 0
            fi

            echo "Waiting for SSH..."
            sleep 20
          done

          echo "SSH connection failed"
          exit 1

      - name: Install Java and Tomcat
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -euo pipefail

          TOMCAT_VERSION="10.1.57"
          TOMCAT_URL="https://archive.apache.org/dist/tomcat/tomcat-10/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz"
          TOMCAT_FILE="/tmp/tomcat.tar.gz"

          dnf install -y java-17-amazon-corretto-devel curl tar

          if [ ! -f /opt/tomcat/bin/startup.sh ]; then
            rm -rf /opt/tomcat
            rm -f "$TOMCAT_FILE"

            curl \
              --fail \
              --location \
              --retry 3 \
              --output "$TOMCAT_FILE" \
              "$TOMCAT_URL"

            tar -tzf "$TOMCAT_FILE" >/dev/null

            mkdir -p /opt/tomcat

            tar \
              -xzf "$TOMCAT_FILE" \
              -C /opt/tomcat \
              --strip-components=1
          fi

          test -f /opt/tomcat/bin/startup.sh || { echo "Tomcat startup.sh not found"; exit 1; }

          chmod +x /opt/tomcat/bin/*.sh
          echo "Tomcat installation successful"

          REMOTE

      - name: Copy WAR to EC2
        shell: bash
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}:/tmp/$APP_NAME.war"

      - name: Deploy application
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -e
          APP_NAME="devopsproject"

          /opt/tomcat/bin/shutdown.sh || true
          sleep 5

          rm -rf "/opt/tomcat/webapps/${APP_NAME}"
          rm -f "/opt/tomcat/webapps/${APP_NAME}.war"

          cp "/tmp/${APP_NAME}.war" \
            "/opt/tomcat/webapps/${APP_NAME}.war"

          chmod 644 "/opt/tomcat/webapps/${APP_NAME}.war"
          /opt/tomcat/bin/startup.sh

          REMOTE

      - name: Verify application
        shell: bash
        run: |
          URL="http://${{ steps.server.outputs.public_ip }}:8080/$APP_NAME/"

          for attempt in {1..30}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "Attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application deployed successfully"
              echo "Application URL: $URL"
              exit 0
            fi

            sleep 10
          done

          echo "Application verification failed"
          exit 1

      - name: Delete temporary SSH key
        if: always()
        run: rm -f key.pem
