name: Java CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  APP_NAME: devopsproject
  WAR_FILE: target/devopsproject.war
  TOMCAT_PORT: "8080"

  VPC_ID: ${{ vars.VPC_ID }}
  SUBNET_ID: ${{ vars.SUBNET_ID }}
  SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build WAR and run SonarCloud
      - name: Build and SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

          test -f "$WAR_FILE"

      # 4. Login to AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5. Find existing EC2 or create new EC2
      - name: Find or create EC2
        id: ec2
        env:
          AWS_KEY_NAME: ${{ secrets.AWS_KEY_NAME }}
        run: |
          set -e

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "EC2 does not exist. Creating new EC2."

            AMI_ID=$(aws ec2 describe-images \
              --owners amazon \
              --filters \
                "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
                "Name=architecture,Values=x86_64" \
                "Name=state,Values=available" \
              --query "sort_by(Images,&CreationDate)[-1].ImageId" \
              --output text)

            if [ "$AMI_ID" = "None" ] || [ -z "$AMI_ID" ]; then
              echo "Amazon Linux AMI was not found"
              exit 1
            fi

            echo "Using AMI: $AMI_ID"

            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t3.micro \
              --key-name "$AWS_KEY_NAME" \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECURITY_GROUP_ID" \
              --associate-public-ip-address \
              --tag-specifications \
                "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
              --query "Instances[0].InstanceId" \
              --output text)

            echo "New EC2 created: $INSTANCE_ID"

          else
            echo "Existing EC2 found: $INSTANCE_ID"

            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped \
                --instance-ids "$INSTANCE_ID"

              STATE="stopped"
            fi

            if [ "$STATE" = "stopped" ]; then
              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
            fi
          fi

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
            echo "EC2 does not have a public IP"
            exit 1
          fi

          echo "ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "EC2 Public IP: $PUBLIC_IP"

      # 6. Create private key file
      - name: Prepare SSH key
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$EC2_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

      # 7. Wait until EC2 SSH is ready
      - name: Wait for EC2
        run: |
          for attempt in {1..30}; do
            ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -i key.pem \
              "$EC2_USER@${{ steps.ec2.outputs.ip }}" \
              "echo connected" && exit 0

            echo "Waiting for EC2..."
            sleep 10
          done

          echo "Unable to connect to EC2"
          exit 1

      # 8. Copy WAR to EC2
      - name: Copy WAR
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.ec2.outputs.ip }}:/tmp/$APP_NAME.war"

      # 9. Install Java, Tomcat and deploy WAR
      - name: Deploy application
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "$EC2_USER@${{ steps.ec2.outputs.ip }}" \
            "sudo bash -s -- '$APP_NAME'" <<'REMOTE'

          set -e

          APP_NAME="$1"
          TOMCAT_VERSION="9.0.120"

          dnf install -y \
            java-17-amazon-corretto-headless \
            curl \
            tar

          if [ ! -f /opt/tomcat/bin/startup.sh ]; then
            curl -fsSL \
              "https://archive.apache.org/dist/tomcat/tomcat-9/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz" \
              -o /tmp/tomcat.tar.gz

            mkdir -p /opt/tomcat

            tar -xzf /tmp/tomcat.tar.gz \
              -C /opt/tomcat \
              --strip-components=1

            chmod +x /opt/tomcat/bin/*.sh
          fi

          /opt/tomcat/bin/shutdown.sh || true
          sleep 5

          rm -rf "/opt/tomcat/webapps/$APP_NAME"
          rm -f "/opt/tomcat/webapps/$APP_NAME.war"

          cp "/tmp/$APP_NAME.war" \
            "/opt/tomcat/webapps/$APP_NAME.war"

          /opt/tomcat/bin/startup.sh

          REMOTE

      # 10. Verify application
      - name: Verify deployment
        run: |
          URL="http://${{ steps.ec2.outputs.ip }}:$TOMCAT_PORT/$APP_NAME/"

          curl \
            --fail \
            --retry 15 \
            --retry-delay 10 \
            --retry-connrefused \
            "$URL"

          echo "Application deployed successfully"
          echo "Application URL: $URL"
          echo "Application URL: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      # 11. Delete private key
      - name: Cleanup
        if: always()
        run: rm -f key.pem
