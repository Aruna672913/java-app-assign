name: Java CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Must exactly match the EC2 Name tag in AWS
  EC2_NAME: Webserver

  # Maven-generated WAR file
  WAR_FILE: target/devopsproject.war

  # Application name in Tomcat URL
  APP_NAME: devopsproject

  # EC2 login user and Tomcat location
  EC2_USER: ec2-user
  TOMCAT_HOME: /opt/tomcat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Download code
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Install Java on GitHub runner
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build WAR file
      - name: Build WAR
        run: mvn clean package

      # 4. Confirm WAR file exists
      - name: Verify WAR
        shell: bash
        run: |
          ls -la target

          if [ ! -f "${{ env.WAR_FILE }}" ]; then
            echo "WAR file not found: ${{ env.WAR_FILE }}"
            exit 1
          fi

          echo "WAR file found: ${{ env.WAR_FILE }}"

      # 5. SonarCloud scan
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      # 6. Connect GitHub Actions to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Confirm AWS login and region
      - name: Test AWS connection
        run: |
          aws sts get-caller-identity
          echo "AWS region: ${{ secrets.AWS_REGION }}"

      # 8. Display EC2 instances for troubleshooting
      - name: List EC2 instances
        run: |
          aws ec2 describe-instances \
            --query "Reservations[].Instances[].{Name:Tags[?Key=='Name']|[0].Value,ID:InstanceId,State:State.Name}" \
            --output table

      # 9. Check whether Webserver already exists
      - name: Check EC2
        id: check
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_NAME }}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EC2 '${{ env.EC2_NAME }}' does not exist"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            echo "Existing EC2 found: $INSTANCE_ID"
          fi

      # 10. Create EC2 only when missing
      - name: Create EC2
        id: create
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          if [ -z "${{ secrets.AWS_KEY_NAME }}" ]; then
            echo "AWS_KEY_NAME secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.AWS_SECURITY_GROUP_ID }}" ]; then
            echo "AWS_SECURITY_GROUP_ID secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.AWS_SUBNET_ID }}" ]; then
            echo "AWS_SUBNET_ID secret is missing"
            exit 1
          fi

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id \
              resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64 \
            --instance-type t3.micro \
            --key-name "${{ secrets.AWS_KEY_NAME }}" \
            --security-group-ids "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --subnet-id "${{ secrets.AWS_SUBNET_ID }}" \
            --associate-public-ip-address \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.EC2_NAME }}}]" \
            --query "Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "EC2 creation failed"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "New EC2 created: $INSTANCE_ID"

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

      # 11. Use existing or newly created EC2
      - name: Get EC2 details
        id: server
        shell: bash
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            INSTANCE_ID="${{ steps.check.outputs.instance_id }}"
          else
            INSTANCE_ID="${{ steps.create.outputs.instance_id }}"
          fi

          if [ -z "$INSTANCE_ID" ]; then
            echo "EC2 instance ID is empty"
            exit 1
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "EC2 state: $STATE"

          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped \
              --instance-ids "$INSTANCE_ID"

            STATE="stopped"
          fi

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          if [ "$STATE" = "pending" ]; then
            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
            echo "EC2 does not have a public IP"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 ID: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"

      # 12. Recreate PEM file from GitHub secret
      - name: Prepare SSH key
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          if [ ! -s key.pem ]; then
            echo "EC2_PRIVATE_KEY secret is missing"
            exit 1
          fi

      # 13. Wait for SSH
      - name: Wait for SSH
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "SSH attempt $attempt"

            if ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i key.pem \
              "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}" \
              "echo SSH connected"; then

              echo "SSH is ready"
              exit 0
            fi

            echo "Waiting for SSH..."
            sleep 20
          done

          echo "SSH connection failed"
          exit 1

      # 14. Install Java and Tomcat only when missing
      - name: Install Java and Tomcat
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}" <<'REMOTE'

              set -e

              if ! command -v java >/dev/null 2>&1; then
                sudo dnf install -y \
                  java-17-amazon-corretto-devel
              fi

              if [ ! -d /opt/tomcat ]; then
                sudo dnf install -y wget tar

                cd /tmp

                wget -q \
                  https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.57/bin/apache-tomcat-10.1.57.tar.gz

                sudo tar -xzf \
                  apache-tomcat-10.1.57.tar.gz \
                  -C /opt

                sudo mv \
                  /opt/apache-tomcat-10.1.57 \
                  /opt/tomcat

                sudo chmod +x \
                  /opt/tomcat/bin/*.sh
              fi

          REMOTE

      # 15. Copy devopsproject.war to EC2
      - name: Copy WAR to EC2
        shell: bash
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "${{ env.WAR_FILE }}" \
            "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}:/tmp/${{ env.APP_NAME }}.war"

      # 16. Deploy WAR to Tomcat
      - name: Deploy application
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}" <<'REMOTE'

              set -e

              sudo /opt/tomcat/bin/shutdown.sh || true
              sleep 5

              sudo rm -rf \
                /opt/tomcat/webapps/devopsproject

              sudo rm -f \
                /opt/tomcat/webapps/devopsproject.war

              sudo cp \
                /tmp/devopsproject.war \
                /opt/tomcat/webapps/devopsproject.war

              sudo chmod 644 \
                /opt/tomcat/webapps/devopsproject.war

              sudo /opt/tomcat/bin/startup.sh

          REMOTE

      # 17. Verify public application
      - name: Verify application
        shell: bash
        run: |
          URL="http://${{ steps.server.outputs.public_ip }}:8080/${{ env.APP_NAME }}/"

          echo "Checking URL: $URL"

          for attempt in {1..20}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "Attempt $attempt: HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application deployed successfully"
              echo "Application URL: $URL"
              exit 0
            fi

            sleep 10
          done

          echo "Application verification failed"
          exit 1

      # 18. Remove temporary key
      - name: Delete temporary key
        if: always()
        run: rm -f key.pem
