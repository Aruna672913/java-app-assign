name: Java CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  EC2_NAME: Webserver
  WAR_FILE: target/devopsproject.war
  APP_NAME: devopsproject
  EC2_USER: ec2-user

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download code
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: Install Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Step 3: Build WAR
      - name: Build application
        run: mvn clean package

      # Step 4: Check WAR file
      - name: Check WAR file
        run: |
          ls -la target

          if [ ! -f "$WAR_FILE" ]; then
            echo "WAR file not found"
            exit 1
          fi

          echo "WAR file created successfully"

      # Step 5: Run SonarCloud
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      # Step 6: Connect to AWS
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 7: Test AWS login
      - name: Test AWS connection
        run: aws sts get-caller-identity

      # Step 8: Check whether EC2 exists
      - name: Check EC2
        id: check_ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=pending,running,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EC2 does not exist"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            echo "Existing EC2 found: $INSTANCE_ID"
          fi

      # Step 9: Create EC2 only if missing
      - name: Create EC2
        id: create_ec2
        if: steps.check_ec2.outputs.exists == 'false'
        run: |
          echo "Finding default VPC"

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=is-default,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text)

          echo "Finding default subnet"

          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=default-for-az,Values=true" \
            --query "Subnets[0].SubnetId" \
            --output text)

          echo "Checking security group"

          SG_ID=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=java-app-sg" \
              "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then

            SG_ID=$(aws ec2 create-security-group \
              --group-name java-app-sg \
              --description "Java Tomcat security group" \
              --vpc-id "$VPC_ID" \
              --query "GroupId" \
              --output text)

            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 22 \
              --cidr 0.0.0.0/0

            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp \
              --port 8080 \
              --cidr 0.0.0.0/0
          fi

          echo "Finding Amazon Linux AMI"

          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
              "Name=state,Values=available" \
            --query "sort_by(Images,&CreationDate)[-1].ImageId" \
            --output text)

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type t3.micro \
            --key-name "${{ secrets.AWS_KEY_NAME }}" \
            --security-group-ids "$SG_ID" \
            --subnet-id "$SUBNET_ID" \
            --associate-public-ip-address \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          echo "New EC2 created: $INSTANCE_ID"

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

      # Step 10: Get existing or new EC2 details
      - name: Get EC2 details
        id: server
        run: |
          if [ "${{ steps.check_ec2.outputs.exists }}" = "true" ]; then
            INSTANCE_ID="${{ steps.check_ec2.outputs.instance_id }}"
          else
            INSTANCE_ID="${{ steps.create_ec2.outputs.instance_id }}"
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          if [ "$STATE" = "stopped" ]; then

            aws ec2 start-instances \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 Public IP: $PUBLIC_IP"

      # Step 11: Create temporary SSH key
      - name: Prepare SSH key
        run: |
          printf '%s\n' "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      # Step 12: Wait for SSH
      - name: Wait for SSH
        run: |
          for attempt in {1..30}; do

            if ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -i key.pem \
              "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
              "echo SSH connected"; then

              exit 0
            fi

            echo "Waiting for SSH"
            sleep 20
          done

          exit 1

      # Step 13: Install Java and Tomcat
      - name: Install Java and Tomcat
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" <<'EOF'

              if ! command -v java >/dev/null 2>&1; then
                sudo dnf install -y java-17-amazon-corretto-devel
              fi

              if [ ! -d /opt/tomcat ]; then

                sudo dnf install -y wget tar

                cd /tmp

                wget https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.53/bin/apache-tomcat-10.1.53.tar.gz

                sudo tar -xzf \
                  apache-tomcat-10.1.53.tar.gz \
                  -C /opt

                sudo mv \
                  /opt/apache-tomcat-10.1.53 \
                  /opt/tomcat

                sudo chmod +x \
                  /opt/tomcat/bin/*.sh
              fi

          EOF

      # Step 14: Copy WAR to EC2
      - name: Copy WAR
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}:/tmp/$APP_NAME.war"

      # Step 15: Deploy WAR to Tomcat
      - name: Deploy application
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" <<EOF

              sudo /opt/tomcat/bin/shutdown.sh || true

              sleep 5

              sudo rm -rf \
                /opt/tomcat/webapps/$APP_NAME

              sudo rm -f \
                /opt/tomcat/webapps/$APP_NAME.war

              sudo cp \
                /tmp/$APP_NAME.war \
                /opt/tomcat/webapps/$APP_NAME.war

              sudo /opt/tomcat/bin/startup.sh

          EOF

      # Step 16: Show application URL
      - name: Show URL
        run: |
          echo "Application URL:"
          echo "http://${{ steps.server.outputs.public_ip }}:8080/$APP_NAME/"

      # Step 17: Delete temporary key
      - name: Delete key
        if: always()
        run: rm -f key.pem
