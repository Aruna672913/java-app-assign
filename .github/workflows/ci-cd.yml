name: Java CI/CD to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  WAR_FILE: target/devopsproject.war
  APP_NAME: devopsproject
  TOMCAT_VERSION: 10.1.57
  HTTPS_PORT: "8443"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WAR_FILE"
          echo "WAR created: $WAR_FILE"

      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS connection
        run: aws sts get-caller-identity

      - name: Check EC2
        id: check_ec2
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Create EC2
        id: create_ec2
        if: steps.check_ec2.outputs.exists == 'false'
        shell: bash
        env:
          AWS_KEY_NAME: ${{ secrets.AWS_KEY_NAME }}
        run: |
          set -euo pipefail

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=is-default,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text)

          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=default-for-az,Values=true" \
            --query "Subnets[0].SubnetId" \
            --output text)

          SG_ID=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=java-app-sg" \
              "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name java-app-sg \
              --description "Java Tomcat HTTPS security group" \
              --vpc-id "$VPC_ID" \
              --query "GroupId" \
              --output text)
          fi

          RUNNER_IP=$(wget -qO- https://checkip.amazonaws.com | tr -d '[:space:]')

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port "$HTTPS_PORT" \
            --cidr 0.0.0.0/0 || true

          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
              "Name=architecture,Values=x86_64" \
              "Name=state,Values=available" \
            --query "sort_by(Images,&CreationDate)[-1].ImageId" \
            --output text)

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type t3.micro \
            --key-name "$AWS_KEY_NAME" \
            --security-group-ids "$SG_ID" \
            --subnet-id "$SUBNET_ID" \
            --associate-public-ip-address \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          aws ec2 wait instance-status-ok \
            --instance-ids "$INSTANCE_ID"

      - name: Get EC2 details
        id: server
        shell: bash
        run: |
          if [ "${{ steps.check_ec2.outputs.exists }}" = "true" ]; then
            INSTANCE_ID="${{ steps.check_ec2.outputs.instance_id }}"
          else
            INSTANCE_ID="${{ steps.create_ec2.outputs.instance_id }}"
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Allow runner SSH
        shell: bash
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          SG_ID=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" \
            --output text)

          RUNNER_IP=$(wget -qO- https://checkip.amazonaws.com | tr -d '[:space:]')

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port "$HTTPS_PORT" \
            --cidr 0.0.0.0/0 || true

      - name: Prepare SSH key
        shell: bash
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EC2_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

      - name: Wait for SSH
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i key.pem \
              "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
              "echo SSH connected"; then
              exit 0
            fi

            sleep 20
          done

          exit 1

      - name: Install Java and Tomcat HTTPS
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -euo pipefail

          TOMCAT_VERSION="10.1.57"
          TOMCAT_FILE="/tmp/tomcat.tar.gz"
          TOMCAT_URL="https://archive.apache.org/dist/tomcat/tomcat-10/v${TOMCAT_VERSION}/bin/apache-tomcat-${TOMCAT_VERSION}.tar.gz"
          KEYSTORE="/opt/tomcat/conf/tomcat.p12"
          KEYSTORE_PASSWORD="changeit"

          dnf install -y \
            java-17-amazon-corretto-devel \
            wget \
            tar

          if [ ! -f /opt/tomcat/bin/startup.sh ]; then
            rm -rf /opt/tomcat
            rm -f "$TOMCAT_FILE"

            wget -q -O "$TOMCAT_FILE" "$TOMCAT_URL"
            tar -tzf "$TOMCAT_FILE" >/dev/null

            mkdir -p /opt/tomcat
            tar -xzf "$TOMCAT_FILE" \
              -C /opt/tomcat \
              --strip-components=1
          fi

          chmod +x /opt/tomcat/bin/*.sh

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -alias tomcat \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=localhost, OU=POC, O=JavaApp, L=NA, ST=NA, C=US"
          fi

          if ! grep -q 'port="8443"' /opt/tomcat/conf/server.xml; then
            sed -i '/<\/Service>/i\
              <Connector port="8443" protocol="org.apache.coyote.http11.Http11NioProtocol" maxThreads="150" SSLEnabled="true">\
                <SSLHostConfig>\
                  <Certificate certificateKeystoreFile="conf/tomcat.p12" certificateKeystorePassword="changeit" type="RSA" />\
                </SSLHostConfig>\
              </Connector>' /opt/tomcat/conf/server.xml
          fi

          REMOTE

      - name: Copy WAR to EC2
        shell: bash
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$WAR_FILE" \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}:/tmp/$APP_NAME.war"

      - name: Deploy application
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "$EC2_USER@${{ steps.server.outputs.public_ip }}" \
            "sudo bash -s" <<'REMOTE'

          set -euo pipefail

          APP_NAME="devopsproject"

          /opt/tomcat/bin/shutdown.sh || true
          sleep 5

          rm -rf "/opt/tomcat/webapps/${APP_NAME}"
          rm -f "/opt/tomcat/webapps/${APP_NAME}.war"

          cp "/tmp/${APP_NAME}.war" \
            "/opt/tomcat/webapps/${APP_NAME}.war"

          chmod 644 \
            "/opt/tomcat/webapps/${APP_NAME}.war"

          /opt/tomcat/bin/startup.sh

          REMOTE

      - name: Verify HTTPS application
        shell: bash
        run: |
          URL="https://${{ steps.server.outputs.public_ip }}:$HTTPS_PORT/$APP_NAME/"

          for attempt in {1..30}; do
            STATUS=$(curl \
              --insecure \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "Attempt $attempt: HTTPS $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application deployed successfully"
              echo "Application URL: $URL"
              exit 0
            fi

            sleep 10
          done

          exit 1

      - name: Delete temporary SSH key
        if: always()
        run: rm -f key.pem
