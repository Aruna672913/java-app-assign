name: Java CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  WAR_FILE: target/devopsproject.war
  APP_NAME: devopsproject
  TOMCAT_HOME: /opt/tomcat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Download code from GitHub
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Install Java on GitHub runner
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build application and create WAR
      - name: Build WAR
        run: mvn clean package

      # 4. Check whether WAR was created
      - name: Verify WAR
        shell: bash
        run: |
          echo "Files inside target folder:"
          ls -la target

          if [ ! -f "${{ env.WAR_FILE }}" ]; then
            echo "WAR file not found: ${{ env.WAR_FILE }}"
            exit 1
          fi

          echo "WAR file found successfully"

      # 5. Run SonarCloud scan
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      # 6. Connect GitHub Actions to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Confirm AWS login
      - name: Test AWS connection
        run: aws sts get-caller-identity

      # 8. Find the existing EC2 instance
      - name: Find existing EC2
        id: server
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_NAME }}" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Existing EC2 '${{ env.EC2_NAME }}' was not found"
            echo "Check the EC2 Name tag, AWS account and AWS region"
            exit 1
          fi

          echo "EC2 found: $INSTANCE_ID"

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          echo "Current EC2 state: $STATE"

          if [ "$STATE" = "stopping" ]; then
            echo "Waiting for EC2 to stop"

            aws ec2 wait instance-stopped \
              --instance-ids "$INSTANCE_ID"

            STATE="stopped"
          fi

          if [ "$STATE" = "stopped" ]; then
            echo "Starting EC2 instance"

            aws ec2 start-instances \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          if [ "$STATE" = "pending" ]; then
            echo "Waiting for EC2 to become ready"

            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID"

            aws ec2 wait instance-status-ok \
              --instance-ids "$INSTANCE_ID"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ "$PUBLIC_IP" = "None" ] || [ -z "$PUBLIC_IP" ]; then
            echo "EC2 does not have a public IP address"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "EC2 Instance ID: $INSTANCE_ID"
          echo "EC2 Public IP: $PUBLIC_IP"

      # 9. Create temporary PEM file
      - name: Prepare SSH key
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          if [ ! -s key.pem ]; then
            echo "EC2_PRIVATE_KEY secret is empty"
            exit 1
          fi

      # 10. Wait until SSH is available
      - name: Wait for SSH
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "SSH attempt: $attempt"

            if ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -i key.pem \
              "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}" \
              "echo SSH connected successfully"; then

              echo "SSH is ready"
              exit 0
            fi

            echo "Waiting for SSH..."
            sleep 20
          done

          echo "SSH connection failed"
          exit 1

      # 11. Install Java and Tomcat only if missing
      - name: Check Java and Tomcat
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}" <<'REMOTE'

              set -e

              if ! command -v java >/dev/null 2>&1; then
                echo "Installing Java"

                sudo dnf install -y \
                  java-17-amazon-corretto-devel
              else
                echo "Java is already installed"
              fi

              if [ ! -d /opt/tomcat ]; then
                echo "Installing Tomcat"

                sudo dnf install -y wget tar

                cd /tmp

                wget -q \
                  https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.57/bin/apache-tomcat-10.1.57.tar.gz

                sudo tar -xzf \
                  apache-tomcat-10.1.57.tar.gz \
                  -C /opt

                sudo mv \
                  /opt/apache-tomcat-10.1.57 \
                  /opt/tomcat

                sudo chmod +x \
                  /opt/tomcat/bin/*.sh
              else
                echo "Tomcat is already installed"
              fi

          REMOTE

      # 12. Copy WAR file to EC2
      - name: Copy WAR to EC2
        shell: bash
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "${{ env.WAR_FILE }}" \
            "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}:/tmp/${{ env.APP_NAME }}.war"

      # 13. Deploy WAR in Tomcat
      - name: Deploy application
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i key.pem \
            "${{ env.EC2_USER }}@${{ steps.server.outputs.public_ip }}" <<'REMOTE'

              set -e

              sudo /opt/tomcat/bin/shutdown.sh || true

              sleep 5

              sudo rm -rf \
                /opt/tomcat/webapps/devopsproject

              sudo rm -f \
                /opt/tomcat/webapps/devopsproject.war

              sudo cp \
                /tmp/devopsproject.war \
                /opt/tomcat/webapps/devopsproject.war

              sudo chmod 644 \
                /opt/tomcat/webapps/devopsproject.war

              sudo /opt/tomcat/bin/startup.sh

          REMOTE

      # 14. Verify application URL
      - name: Verify application
        shell: bash
        run: |
          URL="http://${{ steps.server.outputs.public_ip }}:8080/${{ env.APP_NAME }}/"

          echo "Checking application URL:"
          echo "$URL"

          for attempt in {1..20}; do
            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "Attempt $attempt - HTTP status: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application deployed successfully"
              echo "Application URL: $URL"
              exit 0
            fi

            sleep 10
          done

          echo "Application verification failed"
          exit 1

      # 15. Delete temporary PEM file
      - name: Delete temporary SSH key
        if: always()
        run: rm -f key.pem
