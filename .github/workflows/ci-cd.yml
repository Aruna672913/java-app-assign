name: Java CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_NAME: Webserver
  EC2_USER: ec2-user
  APP_NAME: devopsproject
  WAR_FILE: target/devopsproject.war
  TOMCAT_PORT: "8080"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build WAR
        run: |
          mvn -B clean package
          test -f "$WAR_FILE"

      - name: SonarCloud scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.organization=aruna672913 \
            -Dsonar.projectKey=Aruna672913_java-app-assign \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION }}

      - name: Find or create EC2
        id: ec2
        env:
          VPC_ID: ${{ vars.VPC_ID || secrets.VPC_ID }}
          SUBNET_ID: ${{ vars.SUBNET_ID || secrets.SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ vars.SECURITY_GROUP_ID || secrets.SECURITY_GROUP_ID }}
          AWS_KEY_NAME: ${{ secrets.AWS_KEY_NAME || vars.AWS_KEY_NAME }}
        run: |
          set -e

          if [ -z "$VPC_ID" ] || [ -z "$SUBNET_ID" ] || [ -z "$SECURITY_GROUP_ID" ]; then
            echo "VPC_ID, SUBNET_ID or SECURITY_GROUP_ID is missing"
            exit 1
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=$EC2_NAME" \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Creating new EC2"

            AMI_ID=$(aws ec2 describe-images \
              --owners amazon \
              --filters \
                "Name=name,Values=al2023-ami-2023.*-kernel-6.1-x86_64" \
                "Name=state,Values=available" \
              --query "sort_by(Images,&CreationDate)[-1].ImageId" \
              --output text)

            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t3.micro \
              --key-name "$AWS_KEY_NAME" \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SECURITY_GROUP_ID" \
              --associate-public-ip-address \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$EC2_NAME}]" \
              --query "Instances[0].InstanceId" \
              --output text)
          else
            echo "Using existing EC2: $INSTANCE_ID"

            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query "Reservations[0].Instances[0].State.Name" \
              --output text)

            if [ "$STATE" = "stopping" ]; then
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              STATE="stopped"
            fi

            if [ "$STATE" = "stopped" ]; then
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
            fi
          fi

          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          test "$PUBLIC_IP" != "None" || {
            echo "EC2 has no public IP"
            exit 1
          }

          echo "ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "EC2 Public IP: $PUBLIC_IP"

      - name: Deploy to Tomcat
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$EC2_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

          IP="${{ steps.ec2.outputs.ip }}"

          for attempt in {1..30}; do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -i key.pem "$EC2_USER@$IP" "echo connected" && break

            if [ "$attempt" = "30" ]; then
              echo "SSH failed. Check port 22 and the subnet internet route."
              exit 1
            fi

            sleep 10
          done

          scp -o StrictHostKeyChecking=no -i key.pem \
            "$WAR_FILE" "$EC2_USER@$IP:/tmp/$APP_NAME.war"

          ssh -o StrictHostKeyChecking=no -i key.pem \
            "$EC2_USER@$IP" "sudo bash -s -- '$APP_NAME'" <<'REMOTE'
          set -e
          APP_NAME="$1"

          dnf install -y java-17-amazon-corretto-headless curl tar

          if [ ! -x /opt/tomcat/bin/startup.sh ]; then
            curl -fsSL \
              https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.120/bin/apache-tomcat-9.0.120.tar.gz \
              -o /tmp/tomcat.tar.gz

            mkdir -p /opt/tomcat
            tar -xzf /tmp/tomcat.tar.gz -C /opt/tomcat --strip-components=1
            chmod +x /opt/tomcat/bin/*.sh
          fi

          /opt/tomcat/bin/shutdown.sh || true
          sleep 5
          rm -rf "/opt/tomcat/webapps/$APP_NAME"*
          cp "/tmp/$APP_NAME.war" "/opt/tomcat/webapps/$APP_NAME.war"
          /opt/tomcat/bin/startup.sh
          REMOTE

      - name: Verify deployment
        run: |
          URL="http://${{ steps.ec2.outputs.ip }}:$TOMCAT_PORT/$APP_NAME/"
          curl --fail --retry 15 --retry-delay 10 --retry-connrefused "$URL"
          echo "Application URL: $URL"
          echo "Application URL: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f key.pem
